services:
  studio:
    build: .
    container_name: ai-video-studio
    shm_size: "2gb"
    init: true
    env_file:
      - .env
    environment:
      - HYPERFRAMES_PREVIEW_HOST=0.0.0.0
    ports:
      - "127.0.0.1:3002:3002"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./workspace:/studio
      - gemini_auth:/root/.gemini
      - hf_cache:/root/.cache
      - studio_config:/root/.config
      - studio_agents:/root/.agents
    stdin_open: true
    tty: true

volumes:
  gemini_auth:
  hf_cache:
  studio_config:
  studio_agents: